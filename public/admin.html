<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | سامانه اردوگاه‌ها</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <span class="brand-mark">🛡️</span>
          <span class="brand-name">پنل مدیریت اردوگاه‌ها</span>
        </div>
        <nav class="nav">
          <a href="#dashboard">داشبورد</a>
          <a href="#requests">درخواست‌ها</a>
          <a href="#finance">گزارش مالی</a>
          <a href="#occupancy">اشغال ظرفیت</a>
          <a href="index.html" class="nav-cta">صفحه رزرو</a>
        </nav>
      </div>
    </header>

    <main class="container admin-main">
      <section id="dashboard" class="section">
        <h2 class="section-title">داشبورد مدیریت</h2>
        <div id="kpi-grid" class="kpi-grid">
          <p class="loading">در حال بارگذاری…</p>
        </div>
      </section>

      <section id="finance" class="section">
        <h2 class="section-title">گزارش مالی</h2>
        <div id="finance-grid" class="finance-grid"></div>
      </section>

      <section id="requests" class="section">
        <div class="section-head">
          <h2 class="section-title">مدیریت درخواست‌ها</h2>
          <select id="status-filter">
            <option value="">همه وضعیت‌ها</option>
            <option value="pending">در انتظار تایید</option>
            <option value="approved">تاییدشده</option>
            <option value="paid">پرداخت‌شده</option>
            <option value="rejected">رد شده</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>عنوان دوره</th>
                <th>مسئول</th>
                <th>آیتم‌ها</th>
                <th>مبلغ قابل پرداخت</th>
                <th>وضعیت</th>
                <th>عملیات</th>
              </tr>
            </thead>
            <tbody id="requests-tbody">
              <tr><td colspan="6" class="muted">در حال بارگذاری…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section id="occupancy" class="section">
        <div class="section-head">
          <h2 class="section-title">اشغال ظرفیت</h2>
          <div class="filters">
            <input type="date" id="occ-date" />
            <select id="occ-camp"></select>
            <select id="occ-type"></select>
          </div>
        </div>
        <div id="occupancy-list" class="occupancy-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container"><p>© پنل مدیریت سامانه اردوگاه‌ها</p></div>
    </footer>

    <div id="toast" class="toast hidden"></div>
    <script src="admin.js"></script>
  </body>
</html>
