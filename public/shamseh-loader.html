<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>شمسه — انیمیشن لوگو</title>
    <link rel="stylesheet" href="/shamseh-splash/splash.css" />
  </head>
  <body>
    <main class="stage" aria-label="انیمیشن لوگوی شمسه">
      <div class="emblem" id="emblem">
        <!-- slices from public/shamseh-splash/ -->
      </div>
      <img class="text-band shamseh-text-band" src="/shamseh-splash/text-band.png" alt="شمسه — سامانه تحریریه خبر" width="845" height="205" />
    </main>
    <script>
      const base = "/shamseh-splash";
      const emblem = document.getElementById("emblem");
      for (let i = 0; i < 12; i++) {
        const img = document.createElement("img");
        img.src = `${base}/wedge-${String(i).padStart(2, "0")}.png`;
        img.alt = "";
        img.className = "shamseh-wedge";
        img.style.animationDelay = `${0.08 + i * 0.045}s`;
        img.draggable = false;
        emblem.appendChild(img);
      }
      ["ring", "sun", "core"].forEach((name) => {
        const img = document.createElement("img");
        img.src = `${base}/layer-${name}.png`;
        img.alt = "";
        img.className = `shamseh-layer-${name === "core" ? "core-img" : name}`;
        img.draggable = false;
        emblem.appendChild(img);
      });
    </script>
  </body>
</html>
